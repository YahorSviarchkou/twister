spring:
  datasource:
    url: jdbc:sqlite:twister.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
hibernate:
  show_sql: true

twister:
  app-name: Twister
  app-version: 0.0.1

logging:
  level:
    com.twister: DEBUG
    org.springframework: INFO
    org.hibernate: ERROR
