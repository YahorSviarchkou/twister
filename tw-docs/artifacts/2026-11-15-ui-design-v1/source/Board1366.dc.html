<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Доска заказов 1366×768</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/7781dc5b53071c5e07df3477f7872d87">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+Condensed:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1366px; height: 768px; overflow: hidden">
  <dc-import name="Main" w="{{w}}" h="{{h}}" collapsed="{{yes}}" slots="{{no}}" hint-size="1366px,768px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
  renderVals() { return { w: 1366, h: 768, yes: true, no: false }; }
}
</script>
</body>
</html>
