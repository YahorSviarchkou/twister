name: Feature
description: New behaviour for users or developers
type: Feature
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed. Link notes, ADRs or diagrams in tw-docs.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What to build, as a checklist.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable result that closes the issue.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Related issues, tw-docs paths.
