# Violations that exist today are recorded in ./archunit_store (relative to the module directory).
# FrozenViolationStore only lets the store shrink: fixed violations are removed, new ones and rules without
# an entry fail. To record a fresh baseline, set allowStoreCreation to true temporarily and review the diff.
freeze.store=com.twister.desktop.app.FrozenViolationStore
freeze.store.default.path=archunit_store
freeze.store.default.allowStoreCreation=false
freeze.refreeze=false
# A rule that matches no classes must not pass silently.
archRule.failOnEmptyShould=true
