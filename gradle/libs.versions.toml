[versions]
java = "21"
javafx = "0.1.0"
spring-boot = "3.2.5"
spring-dependency-management = "1.1.7"
lombok = "1.18.48"
mapstruct = "1.6.3"
caffeine = "3.2.3"
junit = "6.0.3"
jacoco = "0.8.16"
spotless = "8.12.0"
palantir-java-format = "2.103.0"
testcontainers = "1.21.4"
postgresql = "42.7.8"

[libraries]
# SPRING
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }

# UTILS
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# TESTING
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

spotless-plugin = { id = "com.diffplug.spotless", version.ref = "spotless" }

javafx-plugin = { id = "org.openjfx.javafxplugin", version.ref = "javafx" }

[bundles]
spring-jpa = [
    "spring-boot-starter",
    "spring-boot-data-jpa"
]
cache = [
    "spring-boot-cache",
    "caffeine"
]
testing = [
    "junit",
    "spring-boot-starter-test"
]
testcontainers = [
    "spring-boot-testcontainers",
    "testcontainers-postgresql",
    "testcontainers-junit"
]
